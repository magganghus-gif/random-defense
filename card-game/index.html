<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>한 끗</title>
<style>
:root{
  --text:#f3f1e8; --muted:#b9c7bf; --panel:rgba(0,0,0,.25);
  --card:#fffdf7; --red:#c8323c; --black:#1d1d1f;
  --accent:#ffcf4a; --good:#5fd38d; --bad:#ff6b6b; --btn:#2a6f58;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at top,#1a6650,#0c2f25 70%) fixed;background-color:#0c2f25;color:var(--text);
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;user-select:none;-webkit-user-select:none}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:12px 16px 20px;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:600;gap:8px}
.top small{color:var(--muted);font-weight:500;margin-left:4px}
.stats{display:flex;align-items:center;gap:10px;white-space:nowrap}
.zone{background:var(--panel);border-radius:14px;padding:12px}
.zone-h{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:10px;gap:8px}
.zone-h b{color:var(--text);font-size:16px}
.row{display:flex;gap:6px;justify-content:center}
.row.hand{flex-wrap:wrap;row-gap:14px;padding-top:6px}
.card{flex:0 0 auto;width:calc((100% - 36px)/7);max-width:62px;aspect-ratio:5/7;background:var(--card);border-radius:8px;
  color:var(--black);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;
  box-shadow:0 2px 5px rgba(0,0,0,.35);transition:transform .12s,outline-color .12s;outline:3px solid transparent;cursor:pointer;position:relative}
.opp .card{width:calc((100% - 24px)/5);max-width:66px;cursor:default}
.card .r{font-size:clamp(15px,4.6vw,22px);line-height:1}
.card .s{font-size:clamp(16px,5vw,24px);line-height:1}
.card.red{color:var(--red)}
.card.sel{transform:translateY(-12px);outline-color:var(--accent)}
.card.deal{animation:deal .35s ease-out both}
@keyframes deal{from{transform:translateY(24px) scale(.85);opacity:0}}
.timer{height:8px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden;margin-top:12px}
.timer>i{display:block;height:100%;width:100%;background:var(--good);transition:width .1s linear}
.timer>i.warn{background:var(--bad)}
.tleft{text-align:right;font-size:13px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.status{min-height:52px;text-align:center;font-weight:700;display:flex;align-items:center;justify-content:center;
  padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.18);font-size:15px;line-height:1.35}
.status.win{color:var(--good)} .status.lose,.status.bad{color:var(--bad)}
.status.great{color:var(--accent);font-size:18px} .status.good{color:var(--good)} .status.meh{color:var(--muted)}
.btns{display:flex;gap:8px}
button{font:inherit;border:0;white-space:nowrap;border-radius:12px;padding:14px 10px;font-weight:700;font-size:16px;cursor:pointer;flex:1;
  background:var(--btn);color:var(--text)}
button.primary{background:var(--accent);color:#3a2a00}
button:disabled{opacity:.38;cursor:default}
button.mini{flex:none;padding:6px 10px;font-size:13px;border-radius:8px;background:rgba(255,255,255,.12)}
.shop h2{margin:2px 0 4px;font-size:20px}
.muted{color:var(--muted);font-size:14px;margin:0 0 12px}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;text-align:left;padding:12px 14px;background:rgba(255,255,255,.1)}
.item small{grid-column:1;color:var(--muted);font-weight:500;font-size:13px}
.item span{grid-row:1/3;grid-column:2;align-self:center;font-size:16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{background:#123f32;border-radius:16px;padding:18px;width:100%;max-width:480px;max-height:90vh;overflow:auto;
  box-shadow:0 10px 30px rgba(0,0,0,.5)}
.sheet h2{margin:0 0 12px}
.ranks ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px}
.ranks li{display:flex;flex-direction:column;padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.06)}
.ranks li span{color:var(--muted);font-size:11px}
.ranks li.on{background:var(--accent);color:#3a2a00}.ranks li.on span{color:#5a4500}
.rank-list{margin:0 0 12px;padding-left:22px;line-height:1.8}
.rank-list li span{color:var(--muted);font-size:13px;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;margin-bottom:6px}
.pk{padding:7px 0;font-size:12px;border-radius:5px;background:var(--card);color:var(--black);flex:none;font-weight:800}
.pk.red{color:var(--red)}
.title{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center}
.title h1{font-size:64px;margin:0;letter-spacing:4px}
.title .sub{color:var(--accent);font-weight:700;margin:-8px 0 0}
.title ul{text-align:left;line-height:1.8;background:var(--panel);border-radius:14px;padding:14px 14px 14px 32px;margin:0}
.big{font-size:40px;text-align:center;margin:4px 0}
.over p{text-align:center;margin:6px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---------- 설정 ----------
const TIME = 30;           // 라운드 제한시간(초)
const HAND = 20;           // 스테이지마다 받는 내 카드 수
const MAX_LIFE = 3;
const PRICE = {pick: 2, discard: 2, life: 3};

const SUITS = ['♠','♥','♦','♣'];
const RL = {11:'J',12:'Q',13:'K',14:'A'};
const rl = r => RL[r] || String(r);
const CAT = ['하이카드','원페어','투페어','트리플','스트레이트','플러시','풀하우스','포카드','스트레이트 플러시'];
const key = c => c.r + c.s;
const isRed = s => s === '♥' || s === '♦';

// ---------- 족보 판정 (1~5장) ----------
function evaluate(cards){
  const n = cards.length;
  const counts = {};
  cards.forEach(c => counts[c.r] = (counts[c.r] || 0) + 1);
  const groups = Object.entries(counts).map(([r,c]) => ({r:+r, c})).sort((a,b) => b.c - a.c || b.r - a.r);
  const tb = groups.map(g => g.r);
  const flush = n === 5 && cards.every(c => c.s === cards[0].s);
  let sHigh = 0;
  if (n === 5 && groups.length === 5){
    const rs = tb.slice().sort((a,b) => b - a);
    if (rs[0] - rs[4] === 4) sHigh = rs[0];
    else if (rs.join() === '14,5,4,3,2') sHigh = 5;
  }
  if (sHigh && flush) return {cat:8, tb:[sHigh]};
  if (groups[0].c === 4) return {cat:7, tb};
  if (groups[0].c === 3 && groups[1] && groups[1].c === 2) return {cat:6, tb};
  if (flush) return {cat:5, tb};
  if (sHigh) return {cat:4, tb:[sHigh]};
  if (groups[0].c === 3) return {cat:3, tb};
  if (groups[0].c === 2 && groups[1] && groups[1].c === 2) return {cat:2, tb};
  if (groups[0].c === 2) return {cat:1, tb};
  return {cat:0, tb};
}
function cmp(a, b){
  if (a.cat !== b.cat) return a.cat - b.cat;
  const len = Math.max(a.tb.length, b.tb.length);
  for (let i = 0; i < len; i++){
    const x = a.tb[i] ?? -1, y = b.tb[i] ?? -1;
    if (x !== y) return x - y;
  }
  return 0;
}
function handName(e){
  const t = e.tb;
  switch(e.cat){
    case 0: return `${rl(t[0])} 하이카드`;
    case 1: return `${rl(t[0])} 원페어`;
    case 2: return `${rl(t[0])}·${rl(t[1])} 투페어`;
    case 3: return `${rl(t[0])} 트리플`;
    case 4: return `${rl(t[0])} 스트레이트`;
    case 5: return `${rl(t[0])} 플러시`;
    case 6: return `${rl(t[0])} 풀하우스`;
    case 7: return `${rl(t[0])} 포카드`;
    case 8: return t[0] === 14 ? '로열 스트레이트 플러시' : `${rl(t[0])} 스트레이트 플러시`;
  }
}

// ---------- 카드 더미 (52장 한 벌, 중복 없음) ----------
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fullDeck(){ const d = []; for (const s of SUITS) for (let r = 2; r <= 14; r++) d.push({r, s}); return d; }
function combos(n, k, f){
  const idx = [];
  (function rec(st){
    if (idx.length === k){ f(idx); return; }
    for (let i = st; i < n; i++){ idx.push(i); rec(i + 1); idx.pop(); }
  })(0);
}
function bestFive(cards){
  if (cards.length <= 5) return cards;
  let best = null, be = null;
  combos(cards.length, 5, idx => {
    const h = idx.map(i => cards[i]); const e = evaluate(h);
    if (!be || cmp(e, be) > 0){ best = h; be = e; }
  });
  return best;
}
// 상대는 항상 5장을 내지만, 스테이지가 오를수록 더 많이 뽑아 그중 최고 5장을 고름
const oppPool = stage => 5 + Math.min(Math.floor((stage - 1) / 2), 4);
function drawPile(n){
  if (S.pile.length < n){ S.pile = shuffle(S.pile.concat(S.discard)); S.discard = []; }
  return S.pile.splice(0, n);
}
function genOpp(){
  const drawn = drawPile(oppPool(S.stage));
  S.discard.push(...drawn);              // 상대가 뽑은 카드는 라운드가 끝나면 버림 더미로
  const five = bestFive(drawn);
  const cnt = {}; five.forEach(c => cnt[c.r] = (cnt[c.r] || 0) + 1);
  return five.slice().sort((a,b) => cnt[b.r] - cnt[a.r] || b.r - a.r);
}
function sortHand(){
  const si = s => SUITS.indexOf(s);
  if (S.sortBy === 'suit') S.hand.sort((a,b) => si(a.s) - si(b.s) || b.r - a.r);
  else S.hand.sort((a,b) => b.r - a.r || si(a.s) - si(b.s));
}
function dealStage(){
  const deck = shuffle(fullDeck());
  S.hand = deck.slice(0, HAND); S.hand.forEach(c => c.fresh = true);
  S.pile = deck.slice(HAND); S.discard = [];
  S.round = 1; sortHand();
}

// ---------- 게임 흐름 ----------
const app = document.getElementById('app');
let best = 0;
try { best = +localStorage.getItem('hankkut-best') || 0; } catch(e){}
let S = {phase:'title'};

function newGame(){
  S = {stage:1, round:1, life:MAX_LIFE, coins:0, hand:[], pile:[], discard:[], sel:new Set(),
       opp:null, oppEval:null, phase:'play', sortBy:'rank', wins:0, close:0, cleared:0,
       modal:null, pickCard:null, discardMode:false, msg:null};
  dealStage();
  startRound();
}
function startRound(){
  S.opp = genOpp(); S.oppEval = evaluate(S.opp); S.oppFresh = true;
  S.sel.clear(); S.phase = 'play'; S.msg = null;
  S.deadline = performance.now() + TIME * 1000;
  render();
}
const selCards = () => [...S.sel].map(i => S.hand[i]);
function play(){
  if (S.phase !== 'play' || !S.sel.size) return;
  const played = selCards();
  const e = evaluate(played);
  const vs = `<br><small>내 ${handName(e)} vs 상대 ${handName(S.oppEval)}</small>`;
  const won = cmp(e, S.oppEval) > 0;
  const diff = e.cat - S.oppEval.cat;
  S.hand = S.hand.filter((_, i) => !S.sel.has(i));   // 낸 카드는 이기든 지든 털림 (새로 받지 않음)
  S.discard.push(...played);
  S.sel.clear();
  if (!won){ S.life--; return endRound(`패배… ${played.length}장은 털었지만 생명 -1${vs}`, 'bad'); }
  S.wins++;
  if (diff === 0){ S.coins++; S.close++; endRound(`아슬아슬! 한 끗 차이 승리 +1🪙${vs}`, 'great'); }
  else if (diff === 1) endRound(`승리! ${played.length}장 털기${vs}`, 'good');
  else endRound(`이겼지만 과했어요…${vs}`, 'meh');
}
function fail(reason){
  S.life--; S.sel.clear();
  endRound(`${reason} — 생명 -1<br><small>상대 ${handName(S.oppEval)}</small>`, 'bad');
}
function endRound(text, tone){
  S.phase = 'result'; S.msg = {text, tone}; S.modal = null;
  render();
  setTimeout(() => {
    if (S.life <= 0) return gameOver();
    if (!S.hand.length) stageClear();
    else { S.round++; startRound(); }
  }, 1400);
}
function stageClear(){
  S.coins += 1; S.cleared++;
  if (S.stage > best){ best = S.stage; try { localStorage.setItem('hankkut-best', best); } catch(e){} }
  S.clearedStage = S.stage;
  S.stage++;
  dealStage();                     // 다음 스테이지 패를 미리 받고 상점에서 다듬기
  S.phase = 'shop'; S.pickCard = null; S.discardMode = false;
  render();
}
function nextStage(){ S.pickCard = null; S.discardMode = false; startRound(); }
function gameOver(){
  S.phase = 'over';
  render();
}
function onCard(i){
  if (S.phase === 'shop' && S.pickCard){
    if (S.coins < PRICE.pick) return;
    S.coins -= PRICE.pick;
    const out = S.hand[i];
    S.pile = S.pile.filter(c => key(c) !== key(S.pickCard));
    S.pile.push(out); shuffle(S.pile);
    S.hand[i] = {...S.pickCard, fresh:true};
    S.pickCard = null; sortHand(); render(); return;
  }
  if (S.phase === 'shop' && S.discardMode){
    if (S.coins < PRICE.discard) return;
    S.coins -= PRICE.discard;
    S.discard.push(S.hand[i]); S.hand.splice(i, 1);
    S.discardMode = false; render(); return;
  }
  if (S.phase !== 'play') return;
  if (S.sel.has(i)) S.sel.delete(i);
  else if (S.sel.size < 5) S.sel.add(i);
  render();
}

// ---------- 화면 ----------
const cardHTML = (c, cls = '', attrs = '') =>
  `<div class="card ${isRed(c.s) ? 'red' : ''} ${cls}" ${attrs}><span class="r">${rl(c.r)}</span><span class="s">${c.s}</span></div>`;

function titleHTML(){
  return `<div class="title">
    <h1>한 끗</h1>
    <p class="sub">딱 한 끗 차이로 이기고, 패를 전부 털어라</p>
    <ul>
      <li>카드 한 벌(52장)에서 <b>20장</b>을 받아요. 중복 카드는 없어요</li>
      <li>매 라운드 상대가 <b>5장</b>을 내요. 더 높은 족보를 1~5장으로 내세요</li>
      <li>낸 카드는 사라지고 <b>새로 받지 않아요</b></li>
      <li>내 패를 <b>전부 털면</b> 스테이지 클리어!</li>
      <li>지는 패를 내도 카드는 털리지만 생명 -1, <b>30초</b> 안에 못 내도 생명 -1</li>
      <li><b>같은 족보</b>로 이기면 아슬아슬 보너스 🪙</li>
    </ul>
    ${best ? `<p class="muted" style="margin:0">최고 기록: 스테이지 ${best} 클리어</p>` : ''}
    <div class="btns"><button class="primary" data-act="start">시작하기</button></div>
  </div>`;
}
function topHTML(){
  return `<div class="top">
    <div>스테이지 <b>${S.stage}</b><small>${S.phase === 'shop' ? '준비' : `라운드 ${S.round}`}</small></div>
    <div class="stats"><span>${'❤️'.repeat(Math.max(S.life,0))}${'🖤'.repeat(Math.max(MAX_LIFE - Math.max(S.life,0), 0))}</span>
    <span>🪙 ${S.coins}</span></div>
  </div>`;
}
function oppHTML(){
  return `<div class="zone">
    <div class="zone-h"><span>상대 패</span></div>
    <div class="row opp">${S.opp.map(c => cardHTML(c, S.oppFresh ? 'deal' : '')).join('')}</div>
    <div class="timer"><i id="bar"></i></div><div class="tleft" id="tleft"></div>
  </div>`;
}
function shopHTML(){
  const busy = S.pickCard || S.discardMode;
  const dis = p => (S.coins < p || busy) ? 'disabled' : '';
  return `<div class="zone shop">
    <h2>스테이지 ${S.clearedStage} 클리어! 🎉</h2>
    <p class="muted">클리어 보상 +1🪙 · 다음 스테이지 패 20장을 새로 받았어요</p>
    <div class="items">
      <button class="item" data-act="buy-pick" ${dis(PRICE.pick)}><b>카드 바꾸기</b><small>원하는 카드를 골라 내 카드 1장과 교체</small><span>🪙${PRICE.pick}</span></button>
      <button class="item" data-act="buy-discard" ${dis(PRICE.discard)}><b>카드 버리기</b><small>털기 힘든 카드 1장을 미리 버리기</small><span>🪙${PRICE.discard}</span></button>
      <button class="item" data-act="buy-life" ${S.life >= MAX_LIFE ? 'disabled' : dis(PRICE.life)}><b>생명 회복</b><small>❤️ +1 (최대 ${MAX_LIFE})</small><span>🪙${PRICE.life}</span></button>
    </div>
  </div>`;
}
function statusHTML(){
  if (S.phase === 'result' || S.phase === 'over'){
    return `<div class="status ${S.msg ? S.msg.tone : ''}">${S.msg ? S.msg.text : ''}</div>`;
  }
  if (S.phase === 'shop'){
    if (S.pickCard) return `<div class="status good">${rl(S.pickCard.r)}${S.pickCard.s} — 바꿀 내 카드를 누르세요&nbsp;<button class="mini" data-act="cancel">취소</button></div>`;
    if (S.discardMode) return `<div class="status good">버릴 내 카드를 누르세요&nbsp;<button class="mini" data-act="cancel">취소</button></div>`;
    return `<div class="status">코인으로 패를 다듬고 시작하세요!</div>`;
  }
  if (!S.sel.size) return `<div class="status meh">상대보다 높은 패를 골라 내세요 (1~5장)</div>`;
  return `<div class="status">내 패: ${handName(evaluate(selCards()))}</div>`;
}
function handHTML(){
  const targeting = S.phase === 'shop' && (S.pickCard || S.discardMode);
  return `<div class="zone">
    <div class="zone-h"><span>내 패 <b>${S.hand.length}</b>장 남음</span>
      <button class="mini" data-act="sort">정렬: ${S.sortBy === 'rank' ? '숫자' : '무늬'}</button></div>
    <div class="row hand">${S.hand.map((c, i) =>
      cardHTML(c, `${S.sel.has(i) ? 'sel' : ''} ${c.fresh ? 'deal' : ''}`, `data-act="card" data-i="${i}" ${targeting ? 'style="outline-color:rgba(255,207,74,.5)"' : ''}`)
    ).join('')}</div>
  </div>`;
}
function buttonsHTML(){
  if (S.phase === 'shop') return `<div class="btns"><button class="primary" data-act="next">스테이지 ${S.stage} 시작 ▶</button></div>`;
  const p = S.phase === 'play';
  const canPlay = p && S.sel.size > 0;
  return `<div class="btns">
    <button data-act="pass" ${p ? '' : 'disabled'}>포기</button>
    <button class="primary" data-act="play" ${canPlay ? '' : 'disabled'}>내기</button>
  </div>`;
}
const CAT_DESC = ['가장 높은 카드','같은 숫자 2장','페어 2개','같은 숫자 3장','연속 숫자 5장','같은 무늬 5장','트리플+원페어','같은 숫자 4장','같은 무늬 연속 5장'];
function ranksHTML(){
  const cur = S.phase === 'play' && S.sel.size ? evaluate(selCards()).cat : -1;
  return `<div class="zone ranks"><div class="zone-h"><span>족보 (높은 순)</span><button class="mini" data-act="help">규칙</button></div>
    <ol>${CAT.map((n, i) => ({n, i})).reverse().map(({n, i}) =>
      `<li class="${i === cur ? 'on' : ''}"><b>${n}</b><span>${CAT_DESC[i]}</span></li>`).join('')}</ol></div>`;
}
function helpHTML(){
  return `<div class="modal" data-act="close"><div class="sheet" data-act="noop">
    <h2>규칙</h2>
    <p class="muted">· 20장을 전부 털면 스테이지 클리어. 낸 카드는 새로 받지 않아요<br>· 스트레이트·플러시는 5장으로만 만들 수 있어요<br>· 같은 족보면 높은 숫자, 그다음 남은 카드(키커) 순으로 비교해요. 약한 카드는 키커로 끼워서 털 수 있어요<br>· 비기면 진 거예요. 반드시 더 높아야 해요<br>· 지는 패를 내도 그 카드는 털리지만 생명 -1<br>· 포기하거나 시간이 지나면 카드는 그대로, 생명 -1<br>· 이 창을 열어도 타이머는 계속 돌아요!</p>
    <div class="btns"><button data-act="close">닫기</button></div>
  </div></div>`;
}
function pickerHTML(){
  const avail = new Set(S.pile.map(key));
  let g = '';
  for (const s of SUITS) for (let r = 14; r >= 2; r--){
    const c = {r, s};
    g += `<button class="pk ${isRed(s) ? 'red' : ''}" data-act="pick" data-r="${r}" data-s="${s}" ${avail.has(key(c)) ? '' : 'disabled'}>${rl(r)}${s}</button>`;
  }
  return `<div class="modal" data-act="close"><div class="sheet" data-act="noop">
    <h2>가져올 카드 고르기</h2><div class="grid">${g}</div>
    <div class="btns" style="margin-top:12px"><button data-act="close">취소</button></div>
  </div></div>`;
}
function overHTML(){
  return `<div class="modal"><div class="sheet over">
    <h2 style="text-align:center">게임 오버</h2>
    <p class="big">스테이지 ${S.stage}</p>
    <p>남은 카드 ${S.hand.length}장 · 승리 ${S.wins}회 · 아슬아슬 ${S.close}회</p>
    <p class="muted" style="text-align:center">클리어한 스테이지 ${S.cleared}개 · 최고 기록 ${best}</p>
    <div class="btns"><button class="primary" data-act="start">다시 하기</button></div>
  </div></div>`;
}
function render(){
  if (S.phase === 'title'){ app.innerHTML = titleHTML(); return; }
  let h = topHTML();
  h += S.phase === 'shop' ? shopHTML() : oppHTML();
  h += statusHTML() + handHTML() + buttonsHTML() + ranksHTML();
  if (S.modal === 'help') h += helpHTML();
  if (S.modal === 'picker') h += pickerHTML();
  if (S.phase === 'over') h += overHTML();
  app.innerHTML = h;
  S.hand.forEach(c => delete c.fresh);
  S.oppFresh = false;
  tick();
}
function tick(){
  if (S.phase !== 'play') return;
  const left = Math.max(0, (S.deadline - performance.now()) / 1000);
  const bar = document.getElementById('bar'), tl = document.getElementById('tleft');
  if (bar){ bar.style.width = (left / TIME * 100) + '%'; bar.className = left < 10 ? 'warn' : ''; }
  if (tl) tl.textContent = Math.ceil(left) + '초';
  if (left <= 0) fail('시간 초과');
}
setInterval(tick, 100);

app.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]');
  if (!t || t.disabled) return;
  switch (t.dataset.act){
    case 'start': newGame(); break;
    case 'card': onCard(+t.dataset.i); break;
    case 'play': play(); break;
    case 'pass': if (S.phase === 'play') fail('포기'); break;
    case 'sort': S.sortBy = S.sortBy === 'rank' ? 'suit' : 'rank'; S.sel.clear(); sortHand(); render(); break;
    case 'help': S.modal = 'help'; render(); break;
    case 'close': S.modal = null; render(); break;
    case 'buy-pick': S.modal = 'picker'; render(); break;
    case 'pick': S.pickCard = {r:+t.dataset.r, s:t.dataset.s}; S.modal = null; render(); break;
    case 'buy-discard': S.discardMode = true; render(); break;
    case 'cancel': S.pickCard = null; S.discardMode = false; render(); break;
    case 'buy-life': if (S.coins >= PRICE.life && S.life < MAX_LIFE){ S.coins -= PRICE.life; S.life++; } render(); break;
    case 'next': nextStage(); break;
  }
});
render();
</script>
</body>
</html>
